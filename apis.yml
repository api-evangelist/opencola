name: OpenCola
description: >-
  OpenCola is a non-profit organization building free, open-source, local-first
  software as an alternative to corporate social media and cloud platforms. Its
  application keeps a user's data on their own device by default, offering
  personal search, offline content archives, multiple personas, trust-based
  connections via tokens, information-centric collaboration, and community
  moderation. The project is grounded in four principles: transparency,
  accountability, personal control, and security (cryptographic verification).
  It is a revival of the original OpenCola (1999), and the current release is a
  local desktop application rather than a hosted service. OpenCola publishes no
  public web API, developer portal, SDK, or OpenAPI at this time; this profile
  captures its identity and open-source posture for the API Evangelist network.
